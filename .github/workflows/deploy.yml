name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/filatei/daybook

jobs:
  # ── 0. GATE ─────────────────────────────────────────────────────────────────
  # Nothing ships unless the migration actually runs. CI already catches this, but
  # CI and Deploy were independent workflows — on 2026-07-13 CI went red on a DDL
  # ordering bug and Deploy shipped the same commit anyway, crash-looping the
  # container and taking production down. The deploy path now blocks on its own
  # check, so a broken migration can never reach the server again.
  gate:
    name: Gate — lint + migration must run
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: daybook_gate
          POSTGRES_USER: daybook
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daybook -d daybook_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Lint (error-level blocks)
        run: npx eslint . --quiet
      - name: Migration — fresh database
        env:
          DATABASE_URL: postgres://daybook:ci-password@localhost:5432/daybook_gate
        run: node scripts/migrate-check.js --label fresh
      - name: Migration — upgrade path (previous release → this commit)
        env:
          PGPASSWORD: ci-password
        run: |
          if ! git rev-parse --verify --quiet HEAD^ >/dev/null; then
            echo "No parent commit to upgrade from — skipping."; exit 0
          fi
          psql -h localhost -U daybook -d postgres -c 'DROP DATABASE IF EXISTS daybook_upgrade'
          psql -h localhost -U daybook -d postgres -c 'CREATE DATABASE daybook_upgrade'
          # Extract INSIDE the workspace — Node resolves `pg` by walking up from the
          # file, so a copy in /tmp would never find ./node_modules.
          rm -rf .migrate-base && mkdir -p .migrate-base
          git archive HEAD^ backend/db.js | tar -x -C .migrate-base
          DATABASE_URL=postgres://daybook:ci-password@localhost:5432/daybook_upgrade \
            DB_MODULE="$GITHUB_WORKSPACE/.migrate-base/backend/db.js" \
            node scripts/migrate-check.js --label old-schema
          DATABASE_URL=postgres://daybook:ci-password@localhost:5432/daybook_upgrade \
            node scripts/migrate-check.js --label upgrade

  # ── 1. Build + push the container image to GHCR ─────────────────────────────
  build:
    name: Build & push image
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # Multi-arch so the image runs whatever the server is (amd64 or arm64).
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. SSH deploy: ship code + restart (server .env is source of truth) ─────
  # Runs only when you opt in by setting repo variable DEPLOY_ON_PUSH=true AND
  # the LINODE_* secrets. Until then it's skipped (no red failures) — deploy with
  # scripts/bootstrap.sh instead.
  deploy:
    name: Deploy to server
    needs: build
    if: ${{ vars.DEPLOY_ON_PUSH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No sudo prep needed — bootstrap.sh already created /opt/daybook group-
      # writable for user1, and scp-action creates any missing target subdirs.
      - name: Copy compose, infra & scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: ${{ secrets.LINODE_SSH_PORT }}
          source: "docker-compose.yml,infra/apache/daybook.torama.money.conf,infra/caddy/Caddyfile,infra/systemd/daybook.service,infra/systemd/daybook-mongo-tunnel.service,scripts/deploy.sh,scripts/server-setup.sh,scripts/remote-install.sh,scripts/bootstrap.sh,scripts/etl.sh"
          target: "/opt/daybook/backend"

      # The server's /opt/daybook/backend/.env is the single source of truth for
      # app config (managed by bootstrap.sh/remote-install.sh and edited on the
      # box for secrets like JWT/AI/SALES). CI does NOT rewrite it — it only ships
      # new code, pulls the freshly built image, and restarts. This avoids
      # clobbering the auto-picked port, the Mongo tunnel URL, and sync settings.
      - name: Pull image + restart (preserves server .env)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USER }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: ${{ secrets.LINODE_SSH_PORT }}
          script: |
            set -e
            cd /opt/daybook/backend
            [ -f .env ] || { echo "no .env on server — run scripts/bootstrap.sh once first"; exit 1; }
            chmod +x scripts/deploy.sh scripts/server-setup.sh scripts/etl.sh
            # GHCR login: needs a CLASSIC PAT with read:packages (or a public package).
            # Non-fatal — if it fails, deploy.sh falls back to the server's local image.
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u filatei --password-stdin \
              || echo "WARN: GHCR login failed — GHCR_TOKEN must be a classic PAT with read:packages, or make the package public"
            bash scripts/deploy.sh
